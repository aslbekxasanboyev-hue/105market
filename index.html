<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>105 Market</title>
<style>
:root{--blue:#1565d8;--blue-d:#0d47a1;--blue-l:#eaf2ff;--line:#dbe6f7;--text:#13233f;--muted:#6b7a99;--red:#e53935;--green:#2e9e5b;--orange:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--blue-l);color:var(--text);line-height:1.4;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
.hidden{display:none!important}
header{background:var(--blue);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(13,71,161,.3)}
.bar{max-width:1150px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;white-space:nowrap;cursor:pointer}
.logo b{background:#fff;color:var(--blue);padding:2px 8px;border-radius:8px;margin-right:6px}
.logo small{font-size:13px;font-weight:600;opacity:.85;margin-left:8px}
.sp{flex:1}
.hbtn{background:#fff;color:var(--blue);border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
.hbtn.ghost{background:rgba(255,255,255,.18);color:#fff}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px}
.lang button{background:none;border:0;color:#fff;font-weight:700;padding:7px 11px;border-radius:8px;font-size:14px}
.lang button.on{background:#fff;color:var(--blue)}
.badge{background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 7px;margin-left:6px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
.btn:hover{background:var(--blue-d)}.btn:disabled{background:#b6c4de;cursor:not-allowed}
.btn.sec{background:var(--blue-l);color:var(--blue)}.btn.danger{background:#fdeaea;color:var(--red)}.btn.ok{background:var(--green)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.field label{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.field input,.field select,.field textarea,.inp{width:100%;padding:10px;border:1px solid #c7d6f0;border-radius:10px;margin-bottom:10px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,25,60,.5);display:none;z-index:20}.overlay.show{display:block}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(10,25,60,.55)}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:92vh;overflow-y:auto;padding:20px;position:relative}
.mbox h2{margin-bottom:12px;font-size:20px;padding-right:30px}
.mclose{position:absolute;top:10px;right:14px;background:none;border:0;font-size:28px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--blue-d);color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:99;max-width:92%;text-align:center}
.st{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.st.new{background:#e0edff;color:var(--blue)}.st.processing{background:#fff3d6;color:#b77900}.st.ready{background:#e6e0ff;color:#5b3fd0}.st.delivered{background:#dff5e8;color:var(--green)}.st.cancelled{background:#fdeaea;color:var(--red)}
.demo{background:#fff3d6;color:#7a5200;text-align:center;font-size:13px;padding:8px 12px}
.photo-prev{width:100%;height:150px;background:var(--blue-l);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden;margin-bottom:8px}
.photo-prev img{width:100%;height:100%;object-fit:cover}

main{max-width:1150px;margin:0 auto;padding:16px}
.search{flex:1;min-width:160px;display:flex;background:#fff;border-radius:10px;overflow:hidden}
.search input{flex:1;border:0;padding:11px 14px;outline:none;min-width:0}
.search span{padding:0 12px;display:flex;align-items:center}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border-radius:18px;padding:26px;margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:26px;margin-bottom:6px}.hero p{opacity:.9}
.perks{display:flex;gap:10px;flex-wrap:wrap}.perk{background:rgba(255,255,255,.16);padding:8px 14px;border-radius:10px;font-size:14px}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.cats{display:flex;gap:8px;overflow-x:auto;flex:1;padding-bottom:4px}
.cat{background:#fff;color:var(--blue);border:2px solid var(--blue);border-radius:99px;padding:7px 16px;font-weight:600;white-space:nowrap}
.cat.on{background:var(--blue);color:#fff}
.tools select{padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(21,101,216,.1);position:relative;transition:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(21,101,216,.18)}
.pic{height:140px;background:var(--blue-l);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden;margin-bottom:10px;cursor:pointer}
.pic img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:18px;left:18px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.pcat{font-size:12px;color:var(--muted);margin-bottom:2px}
.pname{font-weight:600;font-size:15px;flex:1;cursor:pointer}
.prow{margin:6px 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price{color:var(--blue);font-weight:800}.old{color:var(--muted);text-decoration:line-through;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 0;grid-column:1/-1}
footer{text-align:center;color:var(--muted);padding:26px 16px;font-size:14px;line-height:1.7}
.drawer{position:fixed;top:0;right:-100%;width:min(430px,100%);height:100%;background:#fff;z-index:30;transition:right .25s;display:flex;flex-direction:column}
.drawer.show{right:0}
.dh{background:var(--blue);color:#fff;padding:16px;display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.dh button{background:none;border:0;color:#fff;font-size:28px;line-height:1}
.items{flex:1;overflow-y:auto;padding:12px;min-height:90px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .th{width:48px;height:48px;border-radius:8px;background:var(--blue-l);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .i{flex:1;font-size:14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:0;background:var(--blue-l);color:var(--blue);font-weight:800;font-size:16px}
.foot{padding:14px;border-top:1px solid var(--line);max-height:62%;overflow-y:auto}
.foot h4{font-size:13px;color:var(--muted);margin:4px 0 6px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 6px;font-weight:600;color:var(--text);font-size:14px}
.seg button.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue)}
.sumrow{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.sumrow.t{font-weight:800;font-size:18px;margin:6px 0 10px}
.foot .btn{width:100%;padding:13px;font-size:16px}
</style>
</head>

<div class="demo hidden" id="demo"></div>
<header>
  <div class="bar">
    <div class="logo" id="logo" onclick="window.scrollTo(0,0)"></div>
    <div class="search"><input id="q" data-ip="s_search" oninput="renderGrid()"><span>🔍</span></div>
    <div class="lang"><button data-lang="ru" onclick="chLang('ru')">RU</button><button data-lang="uz" onclick="chLang('uz')">UZ</button></div>
    <button class="hbtn" onclick="openCart()">🛒 <span data-i="s_cart"></span><span class="badge" id="count">0</span></button>
  </div>
</header>

<main>
  <div class="hero">
    <div><h1 id="heroT"></h1><p data-i="s_hero2"></p></div>
    <div class="perks"><div class="perk" data-i="s_p1"></div><div class="perk" data-i="s_p2"></div><div class="perk" data-i="s_p3"></div></div>
  </div>
  <div class="tools">
    <div class="cats" id="cats"></div>
    <select id="sort" onchange="renderGrid()"><option value="0" data-i="s_sort0"></option><option value="1" data-i="s_sort1"></option><option value="2" data-i="s_sort2"></option><option value="3" data-i="s_sort3"></option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer id="footer"></footer>

<div class="overlay" id="ov" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="dh"><span data-i="s_yourcart"></span><button onclick="closeCart()">×</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="field">
      <input id="cn" data-ip="s_name" autocomplete="name">
      <input id="cp" data-ip="s_phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+998">
    </div>
    <h4 data-i="s_delivery"></h4>
    <div class="seg"><button id="dl_delivery" data-i="dl_delivery" onclick="setDl('delivery')"></button><button id="dl_pickup" data-i="dl_pickup" onclick="setDl('pickup')"></button></div>
    <div class="field"><input id="ca" data-ip="s_addr" autocomplete="street-address"></div>
    <div class="note" id="pickNote" style="margin-bottom:10px"></div>
    <h4 data-i="s_payment"></h4>
    <div class="seg"><button id="pay_cash" data-i="pay_cash" onclick="setPay('cash')"></button><button id="pay_card" data-i="pay_card" onclick="setPay('card')"></button></div>
    <div class="field"><input id="cc" data-ip="s_comment"></div>
    <div class="sumrow"><span data-i="s_sub"></span><span id="sSub"></span></div>
    <div class="sumrow"><span data-i="s_fee"></span><span id="sFee"></span></div>
    <div class="sumrow t"><span data-i="s_total"></span><span id="sTotal"></span></div>
    <button class="btn" id="orderBtn" data-i="s_order" onclick="placeOrder()"></button>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>

/* --- расчёт заказа (то же самое делает server.js) --- */
function computeOrder(st,body,status){
  const c=body.customer||{};
  const name=String(c.name||"").trim().slice(0,80),phone=String(c.phone||"").trim().slice(0,30),addr=String(c.addr||"").trim().slice(0,200),comment=String(c.comment||"").trim().slice(0,300);
  const delivery=body.delivery==="pickup"?"pickup":"delivery",payment=body.payment==="card"?"card":"cash";
  if(name.length<2||phone.replace(/\D/g,"").length<9||(delivery==="delivery"&&addr.length<3))throw new Error("invalid");
  const items=[];let sub=0;
  for(const it of body.items||[]){
    const p=st.products.find(x=>x.id===+it.id&&x.active!==false),q=Math.floor(+it.qty);
    if(!p||!(q>=1&&q<=99))throw new Error("invalid");
    if(q>p.stock)throw new Error("stock");
    items.push({id:p.id,name:p.name,price:p.price,qty:q});sub+=p.price*q;
  }
  if(!items.length)throw new Error("invalid");
  const s=st.settings,fee=delivery==="delivery"&&!(s.freeFrom>0&&sub>=s.freeFrom)?(+s.deliveryFee||0):0;
  items.forEach(i=>{st.products.find(p=>p.id===i.id).stock-=i.qty});
  const id=st.orders.reduce((m,o)=>Math.max(m,o.id),1000)+1;
  const o={id,date:new Date().toISOString(),customer:{name,phone,addr,comment},items,sub,fee,total:sub+fee,delivery,payment,status:STATUSES.includes(status)?status:"new"};
  st.orders.push(o);return o;
}
function applyStatus(st,id,s){
  const o=st.orders.find(x=>x.id===id);if(!o||!STATUSES.includes(s))throw new Error("invalid");
  if(s==="cancelled"&&o.status!=="cancelled")o.items.forEach(i=>{const p=st.products.find(x=>x.id===i.id);if(p)p.stock+=i.qty});
  if(o.status==="cancelled"&&s!=="cancelled")o.items.forEach(i=>{const p=st.products.find(x=>x.id===i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)});
  o.status=s;
}

const LS="m105_db";
function demoOrders(products){
  let s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  const names=["Азиз","Дилноза","Жасур","Малика","Рустам","Нигора","Бекзод","Сардор"],out=[];
  for(let i=0;i<34;i++){
    const day=Math.floor(r()*14),time=Date.now()-day*864e5-Math.floor(r()*6e6),items=[],n=1+Math.floor(r()*4);
    for(let k=0;k<n;k++){const p=products[Math.floor(r()*products.length)];if(!items.find(x=>x.id===p.id))items.push({id:p.id,name:p.name,price:p.price,qty:1+Math.floor(r()*3)})}
    const sub=items.reduce((a,x)=>a+x.price*x.qty,0),del=r()<.7,fee=del&&sub<150000?10000:0;
    out.push({date:new Date(time).toISOString(),customer:{name:names[Math.floor(r()*names.length)],phone:"+998 90 "+(100+Math.floor(r()*899))+" "+(10+Math.floor(r()*89))+" "+(10+Math.floor(r()*89)),addr:del?"Toshkent, Navoiy ko'chasi, "+(1+Math.floor(r()*80)):"",comment:""},items,sub,fee,total:sub+fee,delivery:del?"delivery":"pickup",payment:r()<.6?"cash":"card",status:day>=2?(r()<.08?"cancelled":"delivered"):(r()<.5?"new":"processing")});
  }
  out.sort((a,b)=>a.date<b.date?-1:1).forEach((o,i)=>o.id=1001+i);
  return out;
}

const DB={
  mode:"local",token:"",
  async init(){
    try{const r=await fetch("/api/ping",{cache:"no-store"});if(r.ok&&(await r.json()).ok)this.mode="server"}catch(e){}
    try{this.token=sessionStorage.getItem("m105_token")||""}catch(e){}
    if(this.mode==="server"&&this.token==="local")this.token="";
    if(this.mode==="local"&&this.token&&this.token!=="local")this.token="";
  },
  async api(p,method="GET",body){
    const h={"Content-Type":"application/json"};if(this.token)h.Authorization="Bearer "+this.token;
    let r;try{r=await fetch("/api"+p,{method,headers:h,body:body!==undefined?JSON.stringify(body):undefined,cache:"no-store"})}catch(e){const x=new Error("net");throw x}
    let j={};try{j=await r.json()}catch(e){}
    if(!r.ok){const x=new Error(j.error||"server");x.status=r.status;throw x}
    return j;
  },
  isAuthed(){return !!this.token},
  logout(){this.token="";try{sessionStorage.removeItem("m105_token")}catch(e){}},
  async login(pw){
    if(this.mode==="server"){const r=await this.api("/login","POST",{password:pw});this.token=r.token}
    else{if(pw!==locLoad().pass){const x=new Error("wrong");x.status=401;throw x}this.token="local"}
    try{sessionStorage.setItem("m105_token",this.token)}catch(e){}
  },
  async getPublic(){
    if(this.mode==="server")return this.api("/public");
    const st=locLoad();return{settings:pubSettings(st.settings),products:st.products.filter(p=>p.active!==false)};
  },
  async createOrder(b){
    if(this.mode==="server")return this.api("/orders","POST",b);
    const st=locLoad(),o=computeOrder(st,b);locSave(st);return{id:o.id};
  },
  async getAdmin(){
    if(this.mode==="server")return this.api("/admin/data");
    const st=locLoad();return{products:st.products,orders:st.orders,settings:st.settings};
  },
  async manualOrder(b,status){
    if(this.mode==="server")return this.api("/admin/orders","POST",{...b,status});
    const st=locLoad(),o=computeOrder(st,b,status);locSave(st);return{id:o.id};
  },
  async setStatus(id,s){
    if(this.mode==="server")return this.api("/admin/orders/"+id,"PATCH",{status:s});
    const st=locLoad();applyStatus(st,id,s);locSave(st);return{ok:1};
  },
  async deleteOrder(id){
    if(this.mode==="server")return this.api("/admin/orders/"+id,"DELETE");
    const st=locLoad();st.orders=st.orders.filter(o=>o.id!==id);locSave(st);return{ok:1};
  },
  async saveProduct(p){
    if(this.mode==="server")return this.api("/admin/products","POST",p);
    const st=locLoad();
    if(p.id){const i=st.products.findIndex(x=>x.id===p.id);if(i<0)throw new Error("invalid");st.products[i]={...st.products[i],...p}}
    else{p={...p,id:st.products.reduce((m,x)=>Math.max(m,x.id),0)+1};st.products.push(p)}
    locSave(st);return{product:st.products.find(x=>x.id===p.id)};
  },
  async deleteProduct(id){
    if(this.mode==="server")return this.api("/admin/products/"+id,"DELETE");
    const st=locLoad();st.products=st.products.filter(p=>p.id!==id);locSave(st);return{ok:1};
  },
  async saveSettings(s){
    if(this.mode==="server")return this.api("/admin/settings","PUT",s);
    const st=locLoad();st.settings={...st.settings,...s};locSave(st);return{ok:1};
  },
  async setPassword(pw){
    if(this.mode==="server")return this.api("/admin/password","POST",{password:pw});
    const st=locLoad();st.pass=pw;locSave(st);return{ok:1};
  },
  resetDemo(){try{localStorage.removeItem(LS)}catch(e){}}
};

    const r=await DB.createOrder({customer:{name,phone,addr:dl==="delivery"?addr:"",comment:$("#cc").value.trim()},items:ids.map(i=>({id:+i,qty:cart[i]})),delivery:dl,payment:pay});
    cart={};saveCart();$("#cc").value="";
    await loadData();renderAll();closeCart();
    openModal(`<div style="text-align:center;padding:10px 0"><div style="font-size:60px">✅</div><h2 style="padding:0">${t("s_thanks_t")}</h2><p style="margin:10px 0 18px">${t("s_thanks",r.id)}</p><button class="btn" onclick="closeModal()">${t("close")}</button></div>`);
  }catch(e){
    toast(e.message==="stock"?t("err_stock"):e.message==="net"?t("err_net"):t("err_invalid"));
    try{await loadData();renderAll()}catch(_){}
  }
  btn.disabled=false;
}

(async function(){
  await DB.init();
  try{await loadData()}catch(e){toast(t("err_net"))}
  renderAll();
  setInterval(async()=>{if($("#drawer").classList.contains("show"))return;try{await loadData();renderCats();renderGrid();renderCart()}catch(e){}},30000);
  window.addEventListener("storage",async()=>{try{await loadData();renderAll()}catch(e){}});
})();
</script>
</body>
</html>
